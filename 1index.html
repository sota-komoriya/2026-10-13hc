<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>名言集</title>
  <link rel="stylesheet" href="css/1style.css">
</head>
<body>
  <div class="wrapper">
    <h1>名言集</h1>
    <div class="left-box">
      <figure>
        <img src="images/noiman.jpg" alt="ジョン・フォン・ノイマン">
        <figcaption>ジョン・フォン・ノイマン</figcaption>
      </figure>
      <p>「明日彼ら（ソ連）を爆撃しようではないかと言われたら、なぜ今日爆撃しないのかと言う。今日の5時にと言うなら、なぜ1時にしないのかと言う」</p>
    </div><!-- /.left-box -->

    <div class="right-box">
      <figure>
        <img src="images/open.jpg" alt="J・ロバート・オッペンハイマー">
        <figcaption>J・ロバート・オッペンハイマー</figcaption>
      </figure>
      <p>「人類の歴史の流れを変えてしまった」</p>
    </div><!-- /.right-box -->

    <div class="center-box">
      <figure>
        <img src="images/brown.jpg" alt="ヴェルナー・フォン・ブラウン">
        <figcaption>ヴェルナー・フォン・ブラウン</figcaption>
      </figure>
      <p>「宇宙開発は、宇宙の広い未知の領域を探検するための、単なる手段以上のものをもたらす。この事を忘れないでほしい。宇宙開発は、この地球上の生活を豊かにすることのできるものであり、その未来への可能性には、限りがない。」</p>
    </div><!-- /.center-box -->
  </div><!-- /.wrapper -->
</body>
</html>
